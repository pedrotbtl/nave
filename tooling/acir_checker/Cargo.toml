[package]
name = "acir_checker"
description = "The formal verifier that processes ACIR given a backend/proof system."
# x-release-please-start-version
version = "1.0.0-beta.9"
# x-release-please-end
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]

thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
fxhash.workspace = true
acir.workspace = true
logos = "0.13.0"
# smtlib = "0.3.0"
rsmt2 = { git = "https://github.com/pedrotbtl/rsmt2.git"}
itertools = "0.14.0"
anyhow = { version = "1.0", default-features = false }
pest = "2.8.1"
pest_derive = "2.8.1"
fm = { path = "../../compiler/fm" }
noirc_frontend = { path = "../../compiler/noirc_frontend" }
noirc_driver = { path = "../../compiler/noirc_driver" }
indexmap = "^2.10.0"

[features]
bn254 = ["acir/bn254"]
bls12_381 = [
    "acir/bls12_381",
]

[dev-dependencies]
noirc_driver.workspace = true
noirc_frontend.workspace = true
ark-bls12-381 = { version = "^0.5.0", default-features = false, features = [
    "curve",
] }
ark-ff.workspace = true
ark-bn254.workspace = true
bn254_blackbox_solver.workspace = true
proptest.workspace = true
num-bigint.workspace = true
zkhash = { version = "^0.2.0", default-features = false }
ark-bn254-v04 = { package = "ark-bn254", version = "^0.4.0", default-features = false, features = [
    "curve",
] }
ark-ff-v04 = {  package = "ark-ff", version = "^0.4.0", default-features = false }
criterion.workspace = true
pprof.workspace = true

[lib]
# See https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
bench = false
